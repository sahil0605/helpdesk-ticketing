<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ticket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <div class="wrap">
    <p id="error" class="error"></p>
    <div class="card">
      <h1 id="subject"></h1>
      <p class="meta" id="meta"></p>
      <p id="description"></p>
      <div id="staff" class="hidden">
        <label>Status</label>
        <select id="status"><option>OPEN</option><option>IN_PROGRESS</option><option>CLOSED</option></select>
        <label>Priority</label>
        <select id="priority"><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select>
        <label>Assignee</label>
        <select id="assignee"></select>
        <button type="button" id="save">Save</button>
        <button type="button" class="secondary" id="close">Close Ticket</button>
      </div>
    </div>
    <div class="card row">
      <h2>Comments</h2>
      <div id="comments"></div>
      <form id="cform">
        <label>Add comment</label>
        <textarea id="message" required></textarea>
        <label id="internalWrap" class="hidden"><input type="checkbox" id="internal"> Internal</label>
        <button type="submit">Post</button>
      </form>
    </div>
    <div class="card row">
      <h2>History</h2>
      <div id="history"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    requireLogin();
    renderNav();
    const id = new URLSearchParams(location.search).get('id');
    const err = document.getElementById('error');
    const staff = isStaff();
    if (staff) {
      document.getElementById('staff').classList.remove('hidden');
      document.getElementById('internalWrap').classList.remove('hidden');
    }

    async function load() {
      err.textContent = '';
      try {
        const data = await apiFetch('/api/tickets/' + id);
        const t = data.ticket;
        document.getElementById('subject').textContent = '#' + t.id + ' ' + t.subject;
        document.getElementById('meta').textContent =
          t.status + ' · ' + t.priority + ' · requester ' + (t.requester && t.requester.name || '') +
          ' · assignee ' + (t.assignedAgent && t.assignedAgent.name || 'unassigned');
        document.getElementById('description').textContent = t.description;
        document.getElementById('status').value = t.status;
        document.getElementById('priority').value = t.priority;
        const comments = document.getElementById('comments');
        comments.innerHTML = '';
        (data.comments || []).forEach(c => {
          const d = document.createElement('div');
          if (c.internal) d.className = 'internal';
          d.innerHTML = '<p class="meta">' + (c.author && c.author.name || '') + (c.internal ? ' (internal)' : '') +
            ' · ' + (c.createdAt || '') + '</p><p>' + c.message + '</p>';
          comments.appendChild(d);
        });
        const hist = document.getElementById('history');
        hist.innerHTML = '';
        (data.history || []).forEach(h => {
          const d = document.createElement('div');
          d.className = 'meta';
          d.textContent = (h.changedAt || '') + ' ' + (h.changedBy && h.changedBy.name || '') +
            ' ' + h.field + ': ' + (h.oldValue || '') + ' → ' + (h.newValue || '');
          hist.appendChild(d);
        });
        if (staff) {
          const sel = document.getElementById('assignee');
          const staffList = await apiFetch('/api/users');
          sel.innerHTML = '<option value="">Unassigned</option>';
          staffList.forEach(s => {
            const o = document.createElement('option');
            o.value = s.id;
            o.textContent = s.name;
            if (t.assignedAgent && t.assignedAgent.id === s.id) o.selected = true;
            sel.appendChild(o);
          });
        }
      } catch (ex) {
        err.textContent = ex.message;
      }
    }

    document.getElementById('save').onclick = async () => {
      err.textContent = '';
      try {
        const assigned = document.getElementById('assignee').value;
        await apiFetch('/api/tickets/' + id, {
          method: 'PUT',
          body: JSON.stringify({
            status: document.getElementById('status').value,
            priority: document.getElementById('priority').value,
            assignedAgentId: assigned ? Number(assigned) : null
          })
        });
        load();
      } catch (ex) { err.textContent = ex.message; }
    };
    document.getElementById('close').onclick = async () => {
      err.textContent = '';
      try {
        const assigned = document.getElementById('assignee').value;
        await apiFetch('/api/tickets/' + id, {
          method: 'PUT',
          body: JSON.stringify({
            status: 'CLOSED',
            priority: document.getElementById('priority').value,
            assignedAgentId: assigned ? Number(assigned) : null
          })
        });
        load();
      } catch (ex) { err.textContent = ex.message; }
    };
    document.getElementById('cform').onsubmit = async (e) => {
      e.preventDefault();
      err.textContent = '';
      try {
        await apiFetch('/api/tickets/' + id + '/comments', {
          method: 'POST',
          body: JSON.stringify({
            message: document.getElementById('message').value,
            internal: document.getElementById('internal').checked
          })
        });
        document.getElementById('message').value = '';
        document.getElementById('internal').checked = false;
        load();
      } catch (ex) { err.textContent = ex.message; }
    };
    load();
  </script>
</body>
</html>
